# ============================================================
# 6号 Mensura（saoo.me 根域）—— Cloudflare Workers + Assets
#
# 部署方式一（命令行）：
#   npx wrangler deploy
#
# 部署方式二（网页上传，推荐）：
#   CF 控制台 → Workers 和 Pages → 创建 → Workers → 上传本目录
#   routes 已在下方写好，deploy 后自动绑定，无需手动添加
#
# name 必须与 CF 控制台上的 Worker 名字一致
# ============================================================
# ★★ K4-fix：name 必须与 CF 控制台上实际存在的 Worker 名一致
# 实际 Worker 名 = mensura-workers（用户截图确认）
# 若写成 mensura-saoo，wrangler deploy 会新建一个空 Worker，
# 域名仍绑在 mensura-workers 上 → 新代码根本不生效
name = "mensura-workers"
account_id = "d49e51b1279804c22035a33a9c1cb06e"
compatibility_date = "2026-09-01"
main = "src/index.js"

# ★ 用 routes 方式绑定（与 5 号 D19 同构）
#   原因：自定义域方式走企业版证书服务，遇 PSL 后缀报「通配符证书不覆盖」
#         routes 方式直接用站点自己的免费 Universal SSL 证书
# ⚠️ 必须在所有 [section] 之前，否则会被当成 assets.routes
routes = [
  { pattern = "saoo.me/*", zone_name = "saoo.me" },
  { pattern = "www.saoo.me/*", zone_name = "saoo.me" }
]

[assets]
directory = "./public"
binding = "ASSETS"

# ★★★ 关键修正（2026-10-26）：让 Worker 先接管这三个 SEO 文件
#
# 【默认行为是「静态资源优先」】
#   请求只要能匹配到 public/ 里的同名文件，就直接返回静态文件，
#   Worker 代码根本不会执行。public/ 里有 ads.txt / robots.txt /
#   sitemap.xml，所以 src/index.js 里那段硬编码拦截默认【不生效】。
#
# 【为什么必须让 Worker 接管】
#   Worker 层返回可以把 Content-Type 钉死（text/plain / application/xml），
#   这是根治 GSC「无法抓取 / 类型未知」和 AdSense「ads.txt 找不到」的关键。
#   交给静态层就得依赖 _headers 的 MIME 声明，多一层不确定。
#
# 【额度影响】这三个路径会 invoke Worker → 计入 100k/天额度，
#   但只有 Google / AdSense 偶尔抓几次，量级可忽略。
# ★ K4 改为 true：www 的 301 需对【所有路径】生效，
#   数组形式只对列出的三个路径生效，www 的其他路径不会跳。
run_worker_first = true

# 请求日志（CF 控制台 → Workers → 该站 → Observability 实时查看）
# invocation_logs 才负责记录「每一次请求」（URL / UA / IP / 状态码）
[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true      # ★ 记录每次调用，缺了它看不到访问者
head_sampling_rate = 1      # 100% 采样，不漏

# Workers Builds 预览构建要求存在此块，留空即可
[previews]
